[project]
name = "gdr"
version = "2026.4"
description = "GDB helper framework for debugging RTOS-based embedded firmware"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Flespark and contributors" }]
keywords = ["gdb", "rtos", "rt-thread", "freertos", "embedded", "debug"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]

# Runtime: GDB Python API only, no external dependencies.
dependencies = []

[project.urls]
Homepage = "https://github.com/flespark/gdr"
Repository = "https://github.com/flespark/gdr"
Issues = "https://github.com/flespark/gdr/issues"
Changelog = "https://github.com/flespark/gdr/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "rtthread", "freertos"]

# ---------------------------------------------------------------------------
# Dev dependencies (uv sync --group dev)
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8",
    "pytest-cov>=6",
    "pre-commit>=3.6",
    "pexpect>=4.9",
]

# ---------------------------------------------------------------------------
# Pyright / basedpyright: point type checkers at the uv-managed virtualenv, and
# turn off the diagnostics that the guarded `gdb` import makes unavoidable.
# NOTE: without venvPath/venv, type checkers resolve imports against the
# system interpreter and report dev-only imports as unresolved. Verified with
# `pyright tests/support/qemu_harness.py`: `Import "pytest" could not be
# resolved` appears whenever the two keys are absent (or point at a missing
# environment) and disappears when they name `.venv`.
# NOTE: `gdb` exists only inside the GDB interpreter, so every module guards
# the import with a `gdb = None` fallback (see gdr/gdb_bridge.py). Pyright then
# reports each `gdb.*` call as an Optional member access and each `gdb.Value`
# annotation as "variable not allowed in type expression" - hundreds of findings
# that are artifacts of that guard rather than defects. Every other check stays
# enabled.
# ruff remains the project's linter of record; this block changes no runtime
# behaviour.
# ---------------------------------------------------------------------------
[tool.pyright]
venvPath = "."
# NOTE: same as the ruff exclude: the extension's bundled runtime is generated.
exclude = ["vscode/resources/gdr"]
venv = ".venv"
reportOptionalMemberAccess = "none"
reportOptionalSubscript = "none"
reportOptionalIterable = "none"
reportInvalidTypeForm = "none"
# NOTE: the gdb stub declares `Function.invoke(self, *args)`, but GDB itself
# never predetermines convenience-function arity -- all available arguments are
# passed to `invoke` and explicit parameter names are the documented idiomatic
# form (see ref/gdb/python_api_doc.md, "Writing new convenience functions").
# Every `invoke` override in core/commands.py therefore trips this rule, and
# all five predate the machine-readable API; the finding is a stub artifact,
# not a defect.
reportIncompatibleMethodOverride = "none"

# ---------------------------------------------------------------------------
# Ruff: linter + formatter (drop-in replacement for black)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"
# NOTE: vscode/resources/gdr is generated by vscode/scripts/vendor-gdr.sh
# (a copy of this runtime for the extension bundle); linting the copy would
# duplicate every finding and report cross-path type mismatches.
exclude = ["vscode/resources/gdr"]

[tool.ruff.lint]
# PEP8 + common-sense rules. E/W = pycodestyle, F = pyflakes, I = isort,
# UP = pyupgrade, B = bugbear, SIM = simplify, ARG = unused arguments,
# PERF = perflint, RUF059/RUF100 = unused unpacking/suppressions.
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "ARG",
    "PERF",
    "RUF059",
    "RUF100",
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["core", "freertos", "rtthread"]

[tool.ruff.format]
# black-compatible defaults.

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"

# ---------------------------------------------------------------------------
# Coverage: every module in core/, rtthread/, freertos/ except the low-level
# GDB/DWARF bridge and raw target-memory walkers (core.gdb_bridge, core.layout,
# rtthread.navigation, freertos.navigation), whose live gdb.Value/DWARF/memory
# walks belong to the QEMU integration suite.
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = [
    "core.adapter",
    "core.api",
    "core.commands",
    "core.constants",
    "core.formatting",
    "core.heapmap",
    "core.help",
    "core.insn_riscv",
    "core.insn_thumb",
    "core.unwind",
    "core.unwind_meta",
    "core.unwind_leaf",
    "core.unwind_segments",
    "core.unwind_arm",
    "core.cpus",
    "core.stack_frame_parser",
    "core.unwind_cfi",
    "core.unwind_ehabi",
    "core.unwind_expr",
    "core.version",
    "rtthread.adapter",
    "rtthread.commands",
    "rtthread.diagnostics",
    "rtthread.layout",
    "rtthread.backtrace",
    "rtthread.backtrace_gdb",
    "rtthread.stack_frame_profile",
    "rtthread.stackpc",
    "rtthread.views",
    "freertos.adapter",
    "freertos.commands",
    "freertos.diagnostics",
    "freertos.heap",
    "freertos.layout",
    "freertos.backtrace",
    "freertos.backtrace_gdb",
    "freertos.objects",
    "freertos.scheduler_switch",
    "freertos.stack_frame_profile",
    "freertos.stackpc",
    "freertos.views",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
