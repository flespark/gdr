[project]
name = "gdr"
version = "2026.2"
description = "GDB helper framework for debugging RTOS-based embedded firmware"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Flespark and contributors" }]
keywords = ["gdb", "rtos", "rt-thread", "freertos", "embedded", "debug"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]

# Runtime: GDB Python API only, no external dependencies.
dependencies = []

[project.urls]
Homepage = "https://github.com/flespark/gdr"
Repository = "https://github.com/flespark/gdr"
Issues = "https://github.com/flespark/gdr/issues"
Changelog = "https://github.com/flespark/gdr/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gdr", "rtthread", "freertos"]

# ---------------------------------------------------------------------------
# Dev dependencies (uv sync --group dev)
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8",
    "pytest-cov>=6",
    "pre-commit>=3.6",
    "pexpect>=4.9",
]

# ---------------------------------------------------------------------------
# Pyright / basedpyright: point type checkers at the uv-managed virtualenv, and
# turn off the diagnostics that the guarded `gdb` import makes unavoidable.
# Reason: without venvPath/venv, type checkers resolve imports against the
# system interpreter and report dev-only imports as unresolved. Verified with
# `pyright tests/support/qemu_harness.py`: `Import "pytest" could not be
# resolved` appears whenever the two keys are absent (or point at a missing
# environment) and disappears when they name `.venv`.
# Reason: `gdb` exists only inside the GDB interpreter, so every module guards
# the import with a `gdb = None` fallback (see gdr/gdb_bridge.py). Pyright then
# reports each `gdb.*` call as an Optional member access and each `gdb.Value`
# annotation as "variable not allowed in type expression" - hundreds of findings
# that are artifacts of that guard rather than defects. Every other check stays
# enabled.
# ruff remains the project's linter of record; this block changes no runtime
# behaviour.
# ---------------------------------------------------------------------------
[tool.pyright]
venvPath = "."
venv = ".venv"
reportOptionalMemberAccess = "none"
reportOptionalSubscript = "none"
reportOptionalIterable = "none"
reportInvalidTypeForm = "none"

# ---------------------------------------------------------------------------
# Ruff: linter + formatter (drop-in replacement for black)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# PEP8 + common-sense rules. E/W = pycodestyle, F = pyflakes, I = isort,
# UP = pyupgrade, B = bugbear, SIM = simplify, ARG = unused arguments,
# PERF = perflint, RUF059/RUF100 = unused unpacking/suppressions.
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "ARG",
    "PERF",
    "RUF059",
    "RUF100",
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["freertos", "gdr", "rtthread"]

[tool.ruff.format]
# black-compatible defaults.

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"

# ---------------------------------------------------------------------------
# Coverage: stable, hardware-independent semantic core
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = [
    "gdr.adapter_api",
    "gdr.commands",
    "gdr.constants",
    "gdr.formatting",
    "gdr.version",
    "rtthread.adapter",
    "rtthread.diagnostics",
    "rtthread.version",
    "rtthread.layout",
    "freertos.adapter",
    "freertos.details",
    "freertos.diagnostics",
    "freertos.heap",
    "freertos.version",
    "freertos.events",
    "freertos.streams",
    "freertos.timers",
    "freertos.layout",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
