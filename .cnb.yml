# CNB pipeline for GDR.
#
# Eleven pipelines:
#  1. validate-py310 — ruff + unit coverage on Python 3.10
#  2. validate-py314 — same checks on Python 3.14
#  3. publish-qemu-matrix-image — timestamped QEMU matrix image (push only)
#  4. publish-gdb12-compat-image — timestamped GDB 12 image (push only)
#  5. gdb12-compat-a9 — Ubuntu 22.04 / GDB 12 / Python 3.10 smoke test
#  6. rtthread-a9-target — RT-Thread Cortex-A9 closed-loop test
#  7. rtthread-rv64-target — RT-Thread RISC-V RV64 closed-loop test
#  8. freertos-snapshot — file-only static ELF decode, no QEMU
#  9. freertos-config-scope — FreeRTOS kernel config variant matrix
# 10. freertos-version-scope — FreeRTOS kernel version matrix, incl. dual-core
# 11. release — source archives and a CNB Release on every pushed tag
#
# One pipeline per verification axis, named `<rtos>-<axis>`, so a red badge
# names the axis that broke without opening a log. RT-Thread splits by target
# (Cortex-A9 / RV64) because a failure there is almost always ISA- or
# port-specific. FreeRTOS is all 32-bit Cortex-M, so target is not its
# interesting axis; its three lanes split by what each one can falsify, which
# also matches the three fixture builders (see ci/freertos/README.md):
#   - freertos-snapshot     ci/freertos/build-fixture-snapshot.sh — a static ELF
#                           holding the diagnostic negatives a healthy kernel
#                           cannot produce. No QEMU, so it is the cheapest lane.
#   - freertos-config-scope ci/freertos/build-fixture-cubel4.sh — kernel pinned
#                           at 10.3.1, 14 config variants (heap_N, static
#                           allocation, trace, registry size, tick width, ...).
#   - freertos-version-scope ci/freertos/build-fixture-kernel.sh — clones
#                           FreeRTOS-Kernel at a tag: 10.4.6, 10.5.1, 11.1.0 on
#                           mps2-an385, plus dual-core SMP and single-core MPU
#                           on mps2-an521 at 11.3.1.
# Splitting the two live lanes also lets each mount only the sources it builds
# from: the CubeL4 lane never clones FreeRTOS-Kernel, and the kernel-direct lane
# never downloads the STM32CubeL4 tree.
#
# The QEMU jobs use `docker.build` with their respective CI Dockerfiles; the
# resulting images are cached by hash on the CNB artifact registry, so later
# runs reuse them. Main-branch pushes also publish the same Dockerfiles under
# human-readable artifact names with `YYYYMMDD-HHMMSS` and `latest` tags:
#   docker.cnb.cool/flespark-2026/gdr/qemu-matrix:<tag>
#   docker.cnb.cool/flespark-2026/gdr/gdb12-compat:<tag>
# Pull requests never update those shared tags, which is the only difference
# between the two event lists: every test pipeline is defined once as an anchor
# and referenced from both `push:` and `pull_request:`, so the two can never
# drift apart. (A PR-only SMP entry once went missing exactly that way.)
# CNB's `pull_request` reads the configured pipeline from the *target* branch's
# `.cnb.yml` (here: main) and checks out the pre-merged commit — so defining
# both `push:` and `pull_request:` under `main:` is the canonical way to gate
# every push and PR.
#
# Arch: `cnb:arch:amd64` runs both Cortex-A9 and RV64 QEMU targets under TCG.
# An arm64 host gains nothing for either cross-ISA target, so amd64 is simplest.
# Ref: https://docs.cnb.cool/zh/build/build-node.html

# Shared with GitHub `.github/workflows/ci.yml` validate: lockfile ruff +
# `uv run pytest tests/unit -v --cov` on the 3.10/3.14 boundaries. GitHub
# additionally runs non-ruff pre-commit hooks. Official `python:` images are
# used because the CNB default image has no pip.
.validate-stages: &validate-stages
  - name: install
    script: |
      pip install --quiet uv
      uv sync --locked --group dev
  - name: ruff check
    script: uv run ruff check .
  - name: ruff format check
    script: uv run ruff format --check .
  - name: unit test coverage
    script: uv run pytest tests/unit -v --cov

.validate-py310: &validate-py310
  name: validate-py310
  docker:
    image: python:3.10
  stages: *validate-stages

.validate-py314: &validate-py314
  name: validate-py314
  docker:
    image: python:3.14
  stages: *validate-stages

# ---------------------------------------------------------------------------
# Shared building blocks for the closed-loop pipelines.
# ---------------------------------------------------------------------------

.amd64-runner: &amd64-runner
  tags: cnb:arch:amd64
  cpus: 8

# ci/Dockerfile pins QEMU, GDB, xPack ARM/RISC-V GCC/newlib, scons, and uv.
# `by` lets CNB invalidate the cached image only when these inputs change;
# rebuilds are otherwise read from the artifact registry.
.qemu-matrix-build: &qemu-matrix-build
  dockerfile: ci/Dockerfile
  by:
    - ci/Dockerfile
    - ci/gdr-xpack/

.gdb12-build: &gdb12-build
  dockerfile: ci/Dockerfile.gdb12
  by:
    - ci/Dockerfile.gdb12

.arm-toolchain-env: &arm-toolchain-env
  GDR_GDB: gdb-multiarch
  RTOS_TOOLCHAIN_PATH: /opt/xpack-arm-none-eabi-gcc-15.2.1-1.1/bin

.freertos-env: &freertos-env
  GDR_GDB: gdb-multiarch
  RTOS_TOOLCHAIN_PATH: /opt/xpack-arm-none-eabi-gcc-15.2.1-1.1/bin
  FREERTOS_FIXTURE_CACHE: /tmp/freertos-fixture

# Reason: probe the exact tools each lane needs before pytest; a missing gcc
# would otherwise pytest.skip the whole lane and report green.
.gdb-python-sanity: &gdb-python-sanity
  name: toolchain sanity (no green-by-skip)
  script: |
    arm-none-eabi-gcc --version | head -1
    "$GDR_GDB" --nx --quiet --batch --ex 'python print("GDR_PYTHON_OK")'

.gdb-python-qemu-sanity: &gdb-python-qemu-sanity
  name: toolchain sanity (no green-by-skip)
  script: |
    arm-none-eabi-gcc --version | head -1
    "$GDR_GDB" --nx --quiet --batch --ex 'python print("GDR_PYTHON_OK")'
    qemu-system-arm --version | head -1

# ---------------------------------------------------------------------------
# Closed-loop pipelines, each defined once and run on both push and PR.
# ---------------------------------------------------------------------------

.gdb12-compat-a9: &gdb12-compat-a9
  name: gdb12-compat-a9
  runner: *amd64-runner
  docker:
    build: *gdb12-build
    volumes:
      - /tmp/rt-thread-build:copy-on-write
      - /root/.cache/uv:copy-on-write
  env:
    GDR_GDB: gdb-multiarch
    GDR_EXPECTED_GDB_MAJOR: "12"
    GDR_EXPECTED_EMBEDDED_PYTHON: "3.10"
    RT_THREAD_REFS: v4.0.5
    RTOS_TOOLCHAIN_PATH: /opt/xpack-arm-none-eabi-gcc-15.2.1-1.1/bin
  stages:
    - name: GDB 12 / Python 3.10 Cortex-A9 smoke test
      script: bash ci/rt-thread/run-qemu-matrix.sh cortex-a9

.rtthread-a9-target: &rtthread-a9-target
  name: rtthread-a9-target
  runner: *amd64-runner
  docker:
    build: *qemu-matrix-build
    volumes:
      # Cache RT-Thread tags and per-version Git clones across CI runs.
      # build-rtt.sh removes ignored SCons outputs before every build.
      - /tmp/rt-thread-build:copy-on-write
      - /root/.cache/uv:copy-on-write
  env: *arm-toolchain-env
  stages:
    - name: pytest matrix (QEMU closed-loop)
      script: bash ci/rt-thread/run-qemu-matrix.sh cortex-a9

.rtthread-rv64-target: &rtthread-rv64-target
  name: rtthread-rv64-target
  runner: *amd64-runner
  docker:
    build: *qemu-matrix-build
    volumes:
      - /tmp/rt-thread-build:copy-on-write
      - /root/.cache/uv:copy-on-write
  env:
    GDR_GDB: gdb-multiarch
    RTOS_TOOLCHAIN_PATH: /opt/xpack-riscv-none-elf-gcc-15.2.0-1/bin
  stages:
    - name: pytest RV64 matrix (QEMU closed-loop)
      script: bash ci/rt-thread/run-qemu-matrix.sh rv64

# Reason: the snapshot lane needs arm-none-eabi-gcc and a Python GDB
# (file-only decode, no QEMU). validate-py310/314 run on plain
# python:3.10/3.14 images with neither, so this must live on the
# qemu-matrix image instead of becoming a green-but-empty skip.
.freertos-snapshot: &freertos-snapshot
  name: freertos-snapshot
  runner: *amd64-runner
  docker:
    build: *qemu-matrix-build
    volumes:
      - /tmp/freertos-fixture:copy-on-write
      # The snapshot builder clones FreeRTOS-Kernel only for its headers.
      - /tmp/gdr-freertos-kernel-source:copy-on-write
      - /root/.cache/uv:copy-on-write
  env: *freertos-env
  stages:
    - <<: *gdb-python-sanity
    - name: static snapshot lane (no QEMU)
      script: |
        uv sync --group dev
        GDR_FORCE_BUILD=1 uv run pytest tests/integration/freertos/test_snapshot.py -v --tb=short

.freertos-config-scope: &freertos-config-scope
  name: freertos-config-scope
  runner: *amd64-runner
  docker:
    build: *qemu-matrix-build
    volumes:
      - /tmp/freertos-fixture:copy-on-write
      # CubeL4 bundles its own kernel copy, so no FreeRTOS-Kernel clone here.
      - /tmp/stm32cubel4-v1.18.2:copy-on-write
      - /tmp/gdr-venv:copy-on-write
      - /root/.cache/uv:copy-on-write
  env: *freertos-env
  stages:
    - <<: *gdb-python-qemu-sanity
    - name: FreeRTOS config variant matrix (kernel 10.3.1)
      script: |
        bash ci/freertos/run-qemu-matrix.sh b-l475e-iot01a 10.3.1 base full static-only static-dynamic trace-off heap-1 heap-2 heap-3 heap-5 heap-protector registry-0 pend-callback streams tick16

.freertos-version-scope: &freertos-version-scope
  name: freertos-version-scope
  runner: *amd64-runner
  docker:
    build: *qemu-matrix-build
    volumes:
      - /tmp/freertos-fixture:copy-on-write
      - /tmp/gdr-freertos-kernel-source:copy-on-write
      - /tmp/gdr-venv:copy-on-write
      - /root/.cache/uv:copy-on-write
  env: *freertos-env
  stages:
    - <<: *gdb-python-qemu-sanity
    - name: FreeRTOS kernel version matrix
      script: |
        bash ci/freertos/run-qemu-matrix.sh mps2-an385 10.4.6 base
        bash ci/freertos/run-qemu-matrix.sh mps2-an385 10.5.1 base
        bash ci/freertos/run-qemu-matrix.sh mps2-an385 11.1.0 base heap-protector heap-2 heap-5-protector streams pend-callback tick16
    # Reason: kept a separate stage so a dual-core failure is attributable at a
    # glance. ARMv8-M SMP exists only from 11.3.1, so this cannot fold into the
    # single-core version sweep above.  The mpu variant (single-core
    # configENABLE_MPU on the same board) shares the board's linker script:
    # its earlier unreachability was a fixture linker defect (the script
    # collected *(.privileged_functions*) instead of *(privileged_functions*)
    # and overlapped every flash region), fixed with the SMP lane -- the two
    # variants boot from the same board directory, so a regression on either
    # fails this stage.
    - name: FreeRTOS dual-core SMP + MPU wrappers (mps2-an521, kernel 11.3.1)
      script: bash ci/freertos/run-qemu-matrix.sh mps2-an521 11.3.1 smp mpu
    # Reason: the 64-bit lane is a separate stage so a RISC-V failure is not
    # conflated with the 32-bit sweep; gdb-multiarch speaks riscv:rv64 and the
    # container env provides XPACK_RISCV_TOOLCHAIN_PATH.
    - name: FreeRTOS 64-bit RISC-V (qemu-virt-rv64, kernel 11.1.0)
      script: bash ci/freertos/run-qemu-matrix.sh qemu-virt-rv64 11.1.0 rv64

main: # branch: main
  push:
    - <<: *validate-py310
    - <<: *validate-py314

    # `docker.build` cache tags are content hashes under `dockerfile-caches`.
    # Publish stable aliases separately so the two large CI images have clear
    # ownership and can be inspected or reused without resolving a hash tag.
    # Push-only: a PR must never move a shared tag.
    - name: publish-qemu-matrix-image
      runner: *amd64-runner
      services:
        - docker
      ifModify:
        - ci/Dockerfile
        - .cnb.yml
      env:
        GDR_CI_IMAGE: docker.cnb.cool/flespark-2026/gdr/qemu-matrix
      stages:
        - name: build and publish QEMU matrix image
          script: |
            IMAGE_TAG=$(date +%Y%m%d-%H%M%S)
            VERSIONED_IMAGE="${GDR_CI_IMAGE}:${IMAGE_TAG}"
            LATEST_IMAGE="${GDR_CI_IMAGE}:latest"
            echo "Publishing ${VERSIONED_IMAGE}"
            docker pull "$LATEST_IMAGE" || true
            docker build --cache-from "$LATEST_IMAGE" --file ci/Dockerfile \
              --tag "$VERSIONED_IMAGE" --tag "$LATEST_IMAGE" .
            docker push "$VERSIONED_IMAGE"
            docker push "$LATEST_IMAGE"

    - name: publish-gdb12-compat-image
      runner: *amd64-runner
      services:
        - docker
      ifModify:
        - ci/Dockerfile.gdb12
        - .cnb.yml
      env:
        GDR_CI_IMAGE: docker.cnb.cool/flespark-2026/gdr/gdb12-compat
      stages:
        - name: build and publish GDB 12 compatibility image
          script: |
            IMAGE_TAG=$(date +%Y%m%d-%H%M%S)
            VERSIONED_IMAGE="${GDR_CI_IMAGE}:${IMAGE_TAG}"
            LATEST_IMAGE="${GDR_CI_IMAGE}:latest"
            echo "Publishing ${VERSIONED_IMAGE}"
            docker pull "$LATEST_IMAGE" || true
            docker build --cache-from "$LATEST_IMAGE" --file ci/Dockerfile.gdb12 \
              --tag "$VERSIONED_IMAGE" --tag "$LATEST_IMAGE" .
            docker push "$VERSIONED_IMAGE"
            docker push "$LATEST_IMAGE"

    - <<: *gdb12-compat-a9
    - <<: *rtthread-a9-target
    - <<: *rtthread-rv64-target
    - <<: *freertos-snapshot
    - <<: *freertos-config-scope
    - <<: *freertos-version-scope

  pull_request:
    # Same test pipelines as push, minus the two image publishers.
    - <<: *validate-py310
    - <<: *validate-py314
    - <<: *gdb12-compat-a9
    - <<: *rtthread-a9-target
    - <<: *rtthread-rv64-target
    - <<: *freertos-snapshot
    - <<: *freertos-config-scope
    - <<: *freertos-version-scope

# `$` applies to every reference. CNB sets CNB_BRANCH to the pushed tag when
# `tag_push` fires. The imported Secret repository file provides
# GDR_RELEASE_TOKEN; it is mapped to CNB_TOKEN only for the release script and
# is never logged.
$:
  tag_push:
    - name: release
      imports: https://cnb.cool/flespark-2026/ci-secrets/-/blob/main/gdr-release.yml
      docker:
        image: node:22-bookworm
      stages:
        - name: install release tools
          script: |
            apt-get update
            apt-get install --yes --no-install-recommends ca-certificates curl git
            rm -rf /var/lib/apt/lists/*
        - name: create source archives
          script: bash ci/create-release-archives.sh "$CNB_BRANCH"
        - name: publish CNB Release
          script: |
            if [[ -z "${GDR_RELEASE_TOKEN:-}" ]]; then
              echo "GDR_RELEASE_TOKEN must be provided by the imported CNB Secret repository file" >&2
              exit 1
            fi
            CNB_TOKEN="$GDR_RELEASE_TOKEN" bash ci/publish-cnb-release.sh "$CNB_BRANCH"
