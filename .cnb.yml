# CNB pipeline for GDR.
#
# Pipelines:
#  1. validate — ruff, pyright, pre-commit hooks, and unit coverage on Python 3.14 & 3.10
#  2. extension — VSCode client vendor/schema check, type-check, tests, VSIX packaging (+ commit attachment on push)
#  3. publish-qemu-matrix-image — re-tag cached QEMU matrix image under timestamped & latest tags (push only)
#  4. publish-gdb12-compat-image — re-tag cached GDB 12 image under timestamped & latest tags (push only)
#  5. publish-gdb-latest-compat-image — re-tag cached latest-GDB image under timestamped & latest tags (push only)
#  6. compat-gdb — GDB 12/13/15/16/latest API surface + GDB 12 / Python 3.10 Cortex-A9 closed-loop (push, or PR touching runtime/gdb_api/Dockerfile.gdb12)
#  7. compat-gdb-latest — latest stable upstream GNU GDB (built from source on Debian trixie) API surface + Cortex-A9 closed-loop (monthly cron, 1st 03:00 Asia/Shanghai)
#  8. bare-eh-frame — RTOS-independent RISC-V .eh_frame/.eh_frame_hdr CFI decoder suite
#  9. rtthread — RT-Thread closed-loop suite (ARM Cortex-M ports -> ARM Cortex-A9 -> RISC-V RV32/RV64)
# 10. freertos — FreeRTOS closed-loop suite (static snapshot -> ARM M3/M0/M4/M33/SMP+MPU -> RISC-V RV32/RV64)
# 11. release — source archives, release VSIX, and CNB Release on every pushed tag
#
# Closed-loop pipelines build their environments with `docker.build` keyed by
# Dockerfile hash (`by` / `versionBy`), so unchanged Dockerfiles reuse the
# cached registry image directly. Main-branch image publishers trigger only
# when their Dockerfile changes and reuse the same `docker:cache` image before
# tagging `YYYYMMDD-HHMMSS` and `latest`:
#   docker.cnb.cool/flespark-2026/gdr/qemu-matrix:<tag>
#   docker.cnb.cool/flespark-2026/gdr/gdb12-compat:<tag>
#   docker.cnb.cool/flespark-2026/gdr/gdb-latest-compat:<tag>
#
# Arch: `cnb:arch:amd64` runs ARM and RISC-V QEMU targets under TCG.
# Ref: https://docs.cnb.cool/zh/build/build-node.html

# ---------------------------------------------------------------------------
# Host-side validation: lint, types, repository hooks, and Python 3.14 / 3.10
# boundary coverage in one pipeline with isolated virtual environments.
# ---------------------------------------------------------------------------
.validate: &validate
  name: validate
  docker:
    image: python:3.14
  env:
    UV_PROJECT_ENVIRONMENT: /tmp/venv-py314
  stages:
    - name: install (Python 3.14)
      script: |
        set -eu
        pip install --quiet uv
        uv sync --locked --group dev
    - name: ruff check
      script: uv run ruff check .
    - name: ruff format check
      script: uv run ruff format --check .
    - name: pyright check
      script: uv run pyright
    - name: repository hooks
      script: SKIP=ruff,ruff-format,pyright uv run pre-commit run --all-files
    - name: unit test coverage (Python 3.14)
      script: uv run pytest tests/unit -v --cov
    - name: unit test coverage (Python 3.10)
      image: python:3.10
      env:
        UV_PROJECT_ENVIRONMENT: /tmp/venv-py310
      script: |
        set -eu
        pip install --quiet uv
        uv sync --locked --group dev
        uv run pytest tests/unit -v --cov

# ---------------------------------------------------------------------------
# Extension lane: the VSCode client under vscode/. Node 24 is required for
# native TypeScript stripping (`node --test` runs sources directly).
# ---------------------------------------------------------------------------
.ext-install: &ext-install
  name: install
  script: |
    cd vscode
    npm ci --no-audit --no-fund

.ext-vendor: &ext-vendor
  name: vendor the runtime and verify the schema handshake
  # NOTE: CNB runs `script:` blocks with the image's POSIX shell (`sh`, dash on
  # Debian), so only POSIX `set -eu` is used.
  script: |
    set -eu
    cd vscode
    npm run vendor
    python3 scripts/check-vendored-schema.py .
    git check-ignore -q resources/gdr/VERSION || {
      echo "vendored runtime is not ignored by git" >&2
      exit 1
    }

.ext-typecheck: &ext-typecheck
  name: type check
  script: cd vscode && npm run check-types

.ext-test: &ext-test
  name: unit tests
  script: cd vscode && npm test

.ext-package: &ext-package
  name: package the VSIX
  # NOTE: `npm test` executes TypeScript sources directly, so `dist/extension.js`
  # exists only after `npm run build`; keep the packaged `.vsix` inside the
  # workspace so `cnbcool/attachments` can upload it by relative path on push.
  script: |
    set -eu
    cd vscode
    npm run build
    npx vsce package --no-dependencies --out gdb-rtos-views.vsix

.ext-attach: &ext-attach
  name: attach VSIX artifact
  image: cnbcool/attachments:latest
  settings:
    attachments:
      - "vscode/gdb-rtos-views.vsix"

.extension: &extension
  name: extension
  docker:
    image: node:24
  stages:
    - *ext-install
    - *ext-vendor
    - *ext-typecheck
    - *ext-test
    - *ext-package

.extension-push: &extension-push
  name: extension
  docker:
    image: node:24
  stages:
    - *ext-install
    - *ext-vendor
    - *ext-typecheck
    - *ext-test
    - *ext-package
    - *ext-attach

# ---------------------------------------------------------------------------
# Shared building blocks for the closed-loop pipelines.
# ---------------------------------------------------------------------------

.amd64-runner: &amd64-runner
  tags: cnb:arch:amd64
  cpus: 16

# `by` and `versionBy` scope the build context and cache hash strictly to the
# Dockerfile so unchanged images are pulled directly from the CNB cache.
.qemu-matrix-build: &qemu-matrix-build
  dockerfile: ci/containers/Dockerfile
  by:
    - ci/containers/Dockerfile
  versionBy:
    - ci/containers/Dockerfile

.gdb12-build: &gdb12-build
  dockerfile: ci/containers/Dockerfile.gdb12
  by:
    - ci/containers/Dockerfile.gdb12
  versionBy:
    - ci/containers/Dockerfile.gdb12

.gdb-latest-build: &gdb-latest-build
  dockerfile: ci/containers/Dockerfile.gdb-latest
  by:
    - ci/containers/Dockerfile.gdb-latest
  versionBy:
    - ci/containers/Dockerfile.gdb-latest

# ---------------------------------------------------------------------------
# Closed-loop pipelines, each defined once and referenced by push & PR.
# ---------------------------------------------------------------------------

.compat-gdb: &compat-gdb
  name: compat-gdb
  runner: *amd64-runner
  docker:
    build: *gdb12-build
  stages:
    - name: GDB 12 API surface (Ubuntu 22.04 / Py 3.10)
      script: python3 ci/checks/gdb_api.py --gdb gdb-multiarch --expected-major 12
    - name: GDB 13 API surface (Debian bookworm / Py 3.11)
      image: debian:bookworm-slim
      script: |
        set -eu
        export DEBIAN_FRONTEND=noninteractive
        apt-get -o Acquire::Retries=3 update -qq
        if ! apt-get -o Acquire::Retries=3 install -y --no-install-recommends gdb-multiarch python3; then
          grep -q ' /etc/localtime ' /proc/mounts
          test -f /var/lib/dpkg/info/tzdata.postinst
          printf '#!/bin/sh\nexit 0\n' > /var/lib/dpkg/info/tzdata.postinst
          dpkg --configure -a
        fi
        python3 ci/checks/gdb_api.py --gdb gdb-multiarch --expected-major 13
    - name: GDB 15 API surface (Ubuntu 24.04 / Py 3.12)
      image: ubuntu:24.04
      script: |
        set -eu
        export DEBIAN_FRONTEND=noninteractive
        apt-get -o Acquire::Retries=3 update -qq
        if ! apt-get -o Acquire::Retries=3 install -y --no-install-recommends gdb-multiarch python3; then
          grep -q ' /etc/localtime ' /proc/mounts
          test -f /var/lib/dpkg/info/tzdata.postinst
          printf '#!/bin/sh\nexit 0\n' > /var/lib/dpkg/info/tzdata.postinst
          dpkg --configure -a
        fi
        python3 ci/checks/gdb_api.py --gdb gdb-multiarch --expected-major 15
    - name: GDB 16 API surface (Debian trixie / Py 3.13)
      image: debian:trixie-slim
      script: |
        set -eu
        export DEBIAN_FRONTEND=noninteractive
        apt-get -o Acquire::Retries=3 update -qq
        if ! apt-get -o Acquire::Retries=3 install -y --no-install-recommends gdb-multiarch python3; then
          grep -q ' /etc/localtime ' /proc/mounts
          test -f /var/lib/dpkg/info/tzdata.postinst
          printf '#!/bin/sh\nexit 0\n' > /var/lib/dpkg/info/tzdata.postinst
          dpkg --configure -a
        fi
        python3 ci/checks/gdb_api.py --gdb gdb-multiarch --expected-major 16
    - name: GDB latest API surface (Debian sid)
      image: debian:sid-slim
      script: |
        set -eu
        export DEBIAN_FRONTEND=noninteractive
        apt-get -o Acquire::Retries=3 update -qq
        if ! apt-get -o Acquire::Retries=3 install -y --no-install-recommends gdb-multiarch python3; then
          grep -q ' /etc/localtime ' /proc/mounts
          test -f /var/lib/dpkg/info/tzdata.postinst
          printf '#!/bin/sh\nexit 0\n' > /var/lib/dpkg/info/tzdata.postinst
          dpkg --configure -a
        fi
        python3 ci/checks/gdb_api.py --gdb gdb-multiarch --min-major 16
    - name: GDB 12 / Python 3.10 Cortex-A9 closed-loop
      script: python3 ci/test.py matrix gdb12

.compat-gdb-latest: &compat-gdb-latest
  name: compat-gdb-latest
  runner: *amd64-runner
  docker:
    build: *gdb-latest-build
  stages:
    - name: Build latest stable upstream GNU GDB and verify API surface
      script: |
        set -eu
        python3 ci/checks/build_latest_gdb.py --prefix /opt/gdb-latest
        python3 ci/checks/gdb_api.py --gdb /opt/gdb-latest/bin/gdb-multiarch --min-major 16
    - name: Latest GNU GDB Cortex-A9 closed-loop
      script: python3 ci/test.py matrix gdb-latest --gdb /opt/gdb-latest/bin/gdb-multiarch

.bare-eh-frame: &bare-eh-frame
  name: bare-eh-frame
  runner: *amd64-runner
  docker:
    build: *qemu-matrix-build
  stages:
    - name: Bare RISC-V eh-frame (qemu-virt-rv64)
      script: python3 ci/test.py matrix bare

.rtthread: &rtthread
  name: rtthread
  runner: *amd64-runner
  docker:
    build: *qemu-matrix-build
  stages:
    - name: RT-Thread ARM Cortex-M ports (M0 / M3 / M4 / M33)
      script: python3 ci/test.py matrix rtthread-arm-ports
    - name: RT-Thread ARM Cortex-A9 (3.1.x–4.1.1)
      script: python3 ci/test.py matrix rtthread-a9
    - name: RT-Thread RISC-V (RV32 / RV64)
      script: python3 ci/test.py matrix rtthread-riscv

.freertos: &freertos
  name: freertos
  runner: *amd64-runner
  docker:
    build: *qemu-matrix-build
  stages:
    # Fast file-only negative checks first, then ARM from basic to complex,
    # followed by RISC-V (32-bit then 64-bit).
    - name: FreeRTOS static snapshot (mps2-an521, 11.1.0)
      script: python3 ci/test.py matrix freertos-snapshot
    - name: FreeRTOS ARM Cortex-M3 config matrix (mps2-an385, 10.3.1)
      script: python3 ci/test.py matrix freertos-config
    - name: FreeRTOS ARM Cortex-M3 version matrix (mps2-an385, 10.4.6–11.1.0)
      script: python3 ci/test.py matrix freertos-arm-version
    - name: FreeRTOS ARM Cortex-M0 (microbit, 11.1.0)
      script: python3 ci/test.py matrix freertos-arm-m0
    - name: FreeRTOS ARM Cortex-M4 soft/softfp/fpu (mps2-an386, 11.3.1)
      script: python3 ci/test.py matrix freertos-arm-m4
    - name: FreeRTOS ARM Cortex-M33 full + fpu (mps2-an505, 11.3.1)
      script: python3 ci/test.py matrix freertos-arm-m33
    - name: FreeRTOS ARM Cortex-M33 SMP + MPU (mps2-an521, 11.3.1)
      script: python3 ci/test.py matrix freertos-arm-smp-mpu
    - name: FreeRTOS RISC-V RV32 (qemu-virt-rv32, 10.3.1–11.3.1)
      script: python3 ci/test.py matrix freertos-rv32
    - name: FreeRTOS RISC-V RV64 (qemu-virt-rv64, 10.4.6–11.3.1)
      script: python3 ci/test.py matrix freertos-rv64

main: # branch: main
  push:
    - <<: *validate
    - <<: *extension-push

    # Publish human-readable aliases only when a Dockerfile changes, reusing the
    # `docker:cache` image shared with `docker.build` instead of rebuilding twice.
    - name: publish-qemu-matrix-image
      runner: *amd64-runner
      services:
        - docker
      ifModify:
        - ci/containers/Dockerfile
      env:
        GDR_CI_IMAGE: docker.cnb.cool/flespark-2026/gdr/qemu-matrix
      stages:
        - name: build or reuse cached QEMU matrix image
          type: docker:cache
          options:
            <<: *qemu-matrix-build
          exports:
            name: CACHE_IMAGE
        - name: tag and publish QEMU matrix image
          script: |
            set -eu
            IMAGE_TAG=$(date +%Y%m%d-%H%M%S)
            VERSIONED_IMAGE="${GDR_CI_IMAGE}:${IMAGE_TAG}"
            LATEST_IMAGE="${GDR_CI_IMAGE}:latest"
            echo "Publishing ${CACHE_IMAGE} as ${VERSIONED_IMAGE} and ${LATEST_IMAGE}"
            attempt=0
            until docker pull "$CACHE_IMAGE"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 18 ]; then
                echo "Timed out waiting for cached image: $CACHE_IMAGE" >&2
                exit 1
              fi
              sleep 5
            done
            docker tag "$CACHE_IMAGE" "$VERSIONED_IMAGE"
            docker tag "$CACHE_IMAGE" "$LATEST_IMAGE"
            docker push "$VERSIONED_IMAGE"
            docker push "$LATEST_IMAGE"

    - name: publish-gdb12-compat-image
      runner: *amd64-runner
      services:
        - docker
      ifModify:
        - ci/containers/Dockerfile.gdb12
      env:
        GDR_CI_IMAGE: docker.cnb.cool/flespark-2026/gdr/gdb12-compat
      stages:
        - name: build or reuse cached GDB 12 compatibility image
          type: docker:cache
          options:
            <<: *gdb12-build
          exports:
            name: CACHE_IMAGE
        - name: tag and publish GDB 12 compatibility image
          script: |
            set -eu
            IMAGE_TAG=$(date +%Y%m%d-%H%M%S)
            VERSIONED_IMAGE="${GDR_CI_IMAGE}:${IMAGE_TAG}"
            LATEST_IMAGE="${GDR_CI_IMAGE}:latest"
            echo "Publishing ${CACHE_IMAGE} as ${VERSIONED_IMAGE} and ${LATEST_IMAGE}"
            attempt=0
            until docker pull "$CACHE_IMAGE"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 18 ]; then
                echo "Timed out waiting for cached image: $CACHE_IMAGE" >&2
                exit 1
              fi
              sleep 5
            done
            docker tag "$CACHE_IMAGE" "$VERSIONED_IMAGE"
            docker tag "$CACHE_IMAGE" "$LATEST_IMAGE"
            docker push "$VERSIONED_IMAGE"
            docker push "$LATEST_IMAGE"

    - name: publish-gdb-latest-compat-image
      runner: *amd64-runner
      services:
        - docker
      ifModify:
        - ci/containers/Dockerfile.gdb-latest
      env:
        GDR_CI_IMAGE: docker.cnb.cool/flespark-2026/gdr/gdb-latest-compat
      stages:
        - name: build or reuse cached latest-GDB compatibility image
          type: docker:cache
          options:
            <<: *gdb-latest-build
          exports:
            name: CACHE_IMAGE
        - name: tag and publish latest-GDB compatibility image
          script: |
            set -eu
            IMAGE_TAG=$(date +%Y%m%d-%H%M%S)
            VERSIONED_IMAGE="${GDR_CI_IMAGE}:${IMAGE_TAG}"
            LATEST_IMAGE="${GDR_CI_IMAGE}:latest"
            echo "Publishing ${CACHE_IMAGE} as ${VERSIONED_IMAGE} and ${LATEST_IMAGE}"
            attempt=0
            until docker pull "$CACHE_IMAGE"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 18 ]; then
                echo "Timed out waiting for cached image: $CACHE_IMAGE" >&2
                exit 1
              fi
              sleep 5
            done
            docker tag "$CACHE_IMAGE" "$VERSIONED_IMAGE"
            docker tag "$CACHE_IMAGE" "$LATEST_IMAGE"
            docker push "$VERSIONED_IMAGE"
            docker push "$LATEST_IMAGE"

    - <<: *compat-gdb
    - <<: *bare-eh-frame
    - <<: *rtthread
    - <<: *freertos

  # Monthly upper-bound GDB check (1st of each month, 03:00 Asia/Shanghai)
  # catches upstream GDB releases without adding push/PR churn.
  "crontab: 0 3 1 * *":
    - <<: *compat-gdb-latest

  pull_request:
    - <<: *validate
    - <<: *extension
    - <<: *compat-gdb
      ifModify:
        - "gdr.py"
        - "core/**"
        - "rtthread/**"
        - "freertos/**"
        - "ci/checks/gdb_api.py"
        - "ci/containers/Dockerfile.gdb12"
    - <<: *bare-eh-frame
    - <<: *rtthread
    - <<: *freertos

# `$` applies to every reference. CNB sets CNB_BRANCH to the pushed tag when
# `tag_push` fires. The imported Secret repository file provides
# GDR_RELEASE_TOKEN; it is mapped to CNB_TOKEN only for the release script and
# is never logged.
$:
  tag_push:
    - name: release
      imports: "https://cnb.cool/flespark-2026/ci-secrets/-/blob/main/gdr-\
        release.yml"
      docker:
        image: node:24-bookworm
      stages:
        - name: install release tools
          script: |
            apt-get update
            apt-get install --yes --no-install-recommends \
              ca-certificates curl git python3
            rm -rf /var/lib/apt/lists/*
        - name: create source archives
          script: |
            set -eu
            if ! git rev-parse --verify "${CNB_BRANCH}^{commit}" >/dev/null 2>&1; then
              git fetch --force origin "refs/tags/${CNB_BRANCH}:refs/tags/${CNB_BRANCH}"
            fi
            bash ci/release/create-archives.sh "$CNB_BRANCH"
        - name: build the release VSIX
          # NOTE: same versioned `vscode/scripts/build-vsix.sh` the GitHub release
          # runs, so both forges attach the identical file name; the tag
          # check fails the pipeline on a mistagged release.
          script: bash vscode/scripts/build-vsix.sh "$CNB_BRANCH"
        - name: publish CNB Release
          script: |
            if [ -z "${GDR_RELEASE_TOKEN:-}" ]; then
              echo "GDR_RELEASE_TOKEN must be provided by the" \
                "imported CNB Secret repository file" >&2
              exit 1
            fi
            CNB_TOKEN="$GDR_RELEASE_TOKEN" \
              bash ci/release/publish-cnb.sh "$CNB_BRANCH"
