version: 2
updates:
  # NOTE: every workflow action is pinned to a commit SHA (an immutable
  # reference), so Dependabot is what keeps those pins current instead of a
  # floating tag that can change under us.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # NOTE: hold back a fresh release for a few days so a compromised or
    # immediately yanked version does not walk straight into CI.
    cooldown:
      default-days: 30
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  # Kept from the previous configuration: the Python side of the repository.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

  # The extension's own dependencies (vsce, typescript, @types/*) under vscode/.
  - package-ecosystem: npm
    directory: /vscode
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    ignore:
      # NOTE: TypeScript 7 (tsgo) drops the JS compiler API (`ts.transpileModule`)
      # required by `vscode/test/*.test.ts`.
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]
      # NOTE: `@types/vscode` must not exceed `engines.vscode` (`^1.85.0`) in
      # package.json or `vsce package` rejects the manifest.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
