name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  extension:
    name: Extension (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Mirrors the CNB `extension` lane: regenerate the bundled runtime, verify
    # the envelope-schema handshake, then type check and test with Node's native
    # TypeScript stripping (the sources are not compiled for the tests).
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
    defaults:
      run:
        working-directory: vscode
    steps:
      # Actions are pinned to commit SHAs (see .github/dependabot.yml).
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Install extension dependencies
        run: npm ci --no-audit --no-fund
      - name: Vendor the runtime and verify the schema handshake
        run: |
          set -euo pipefail
          npm run vendor
          python3 ../ci/check-vendored-schema.py .
          git check-ignore -q resources/gdr/VERSION
      - name: Type check
        run: npm run check-types
      - name: Test
        run: npm test
      - name: Package the VSIX
        # Reason: a release-grade `.vsix` must be reproducible from a clean
        # tree (`npm ci` + vendored runtime + `vsce package`); the artifact is
        # for manual verification and manual publishing, never auto-release --
        # CI holds no marketplace credentials.
        run: npx vsce package --no-dependencies --out gdb-rtos-views.vsix
      - name: Upload the VSIX as a build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: gdb-rtos-views-vsix
          path: vscode/gdb-rtos-views.vsix
          if-no-files-found: error
  validate:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      # Actions are pinned to commit SHAs (see .github/dependabot.yml).
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          enable-cache: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: uv sync --locked --group dev
      - name: Run ruff
        # Same lockfile ruff as CNB validate; keep extra pre-commit hooks below.
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Run repository hooks
        env:
          SKIP: ruff,ruff-format
        run: uv run pre-commit run --all-files
      - name: Run unit tests with coverage
        run: uv run pytest tests/unit -v --cov
      - name: Run integration tests when fixtures are available
        run: uv run pytest tests/integration -v
