name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GitHub Actions covers host-side basic validation (`validate` + `extension`).
# Closed-loop QEMU/GDB integration suites run on CNB (see `.cnb.yml` and
# `docs/testing.md`).
jobs:
  extension:
    name: Extension (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Mirrors the CNB `extension` lane: regenerate the bundled runtime, verify
    # the envelope-schema handshake, then type check and test with Node's native
    # TypeScript stripping (the sources are not compiled for the tests).
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
    defaults:
      run:
        working-directory: vscode
    steps:
      # Actions are pinned to commit SHAs (see .github/dependabot.yml).
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Install extension dependencies
        run: npm ci --no-audit --no-fund
      - name: Vendor the runtime and verify the schema handshake
        run: |
          set -euo pipefail
          npm run vendor
          python3 scripts/check-vendored-schema.py .
          git check-ignore -q resources/gdr/VERSION
      - name: Type check
        run: npm run check-types
      - name: Test
        run: npm test
      - name: Package the VSIX
        # NOTE: a release-grade `.vsix` must be reproducible from a clean
        # tree (`npm ci` + vendored runtime + `vsce package`); the artifact is
        # for manual verification and manual publishing, never auto-release --
        # CI holds no marketplace credentials. `npm test` runs the TypeScript
        # sources directly, so `dist/extension.js` only exists after an
        # explicit `npm run build`; without it vsce refuses the entrypoint.
        run: |
          npm run build
          npx vsce package --no-dependencies --out gdb-rtos-views.vsix
      - name: Upload the VSIX as a build artifact
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gdb-rtos-views-vsix
          path: vscode/gdb-rtos-views.vsix
          if-no-files-found: error

  validate:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      # Actions are pinned to commit SHAs (see .github/dependabot.yml).
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.1.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: true
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: uv sync --locked --group dev
      - name: Run ruff
        # Same lockfile ruff as CNB validate; keep extra pre-commit hooks below.
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Run pyright
        # Same lockfile pyright as CNB validate; skip duplicating it below.
        run: uv run pyright
      - name: Run repository hooks
        env:
          SKIP: ruff,ruff-format,pyright
        run: uv run pre-commit run --all-files
      - name: Run unit tests with coverage
        run: uv run pytest tests/unit -v --cov
