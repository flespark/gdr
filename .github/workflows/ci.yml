name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: uv sync --locked --group dev
      - name: Run ruff
        # Same lockfile ruff as CNB validate; keep extra pre-commit hooks below.
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Run repository hooks
        env:
          SKIP: ruff,ruff-format
        run: uv run pre-commit run --all-files
      - name: Run unit tests with coverage
        run: uv run pytest tests/unit -v --cov
      - name: Run integration tests when fixtures are available
        run: uv run pytest tests/integration -v
