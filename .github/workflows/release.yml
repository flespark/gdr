name: Release

on:
  push:
    tags:
      - "20*.*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          # Reason: this job publishes through `gh release create` with
          # GH_TOKEN, so the checkout token is not needed in .git/config.
          persist-credentials: false
      - name: Verify the calendar release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            20[0-9][0-9].[0-9][0-9]) ;;
            *)
              echo "expected a YYYY.MM release tag, got: $TAG" >&2
              exit 1
              ;;
          esac
      - name: Create source archives
        env:
          TAG: ${{ github.ref_name }}
        run: bash ci/create-release-archives.sh "$TAG"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes_file="$(mktemp)"
          bash ci/extract-changelog.sh "$TAG" >"$notes_file"
          gh release create "$TAG" \
            --title "GDR $TAG" \
            --notes-file "$notes_file" \
            "dist/gdr-$TAG.tar.gz" \
            "dist/gdr-$TAG.zip" \
            "dist/gdr-latest.tar.gz" \
            "dist/gdr-latest.zip"
