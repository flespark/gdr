name: Release

on:
  push:
    tags:
      - "20*.*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          # Reason: this job publishes through `gh release create` with
          # GH_TOKEN, so the checkout token is not needed in .git/config.
          persist-credentials: false
      - name: Verify the calendar release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            20[0-9][0-9].[0-9][0-9]) ;;
            *)
              echo "expected a YYYY.MM release tag, got: $TAG" >&2
              exit 1
              ;;
          esac
      - name: Create source archives
        env:
          TAG: ${{ github.ref_name }}
        run: bash ci/create-release-archives.sh "$TAG"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          # Reason: no dependency cache on a release job -- a poisoned cache
          # would flow into the published VSIX, and `npm ci` from the
          # lockfile is hermetic without it.
          node-version: "24"
      - name: Build the release VSIX
        # Reason: the file name carries the extension version from
        # vscode/package.json (GDR `2026.4` ships as extension `2026.4.0`),
        # and the script refuses a tag the extension does not track, so a
        # mistagged release fails here instead of shipping a wrong VSIX.
        env:
          TAG: ${{ github.ref_name }}
        run: bash ci/build-vsix.sh "$TAG"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes_file="$(mktemp)"
          bash ci/extract-changelog.sh "$TAG" >"$notes_file"
          shopt -s nullglob
          vsix_files=(dist/gdb-rtos-views-*.vsix)
          if [[ ${#vsix_files[@]} -ne 1 ]]; then
            echo "expected exactly one release VSIX in dist/" >&2
            exit 1
          fi
          gh release create "$TAG" \
            --title "GDR $TAG" \
            --notes-file "$notes_file" \
            "dist/gdr-$TAG.tar.gz" \
            "dist/gdr-$TAG.zip" \
            "dist/gdr-latest.tar.gz" \
            "dist/gdr-latest.zip" \
            "${vsix_files[0]}"
